<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentGrid - Autonomous Compute Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfeff',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
            },
            slate: {
              850: '#151f32',
              900: '#0b1120',
              950: '#060a12',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #060a12;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Icons ---
    const ServerIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2" strokeWidth="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2" strokeWidth="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6" strokeWidth="2"/>
        <line x1="6" y1="18" x2="6.01" y2="18" strokeWidth="2"/>
      </svg>
    );

    const CpuIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" strokeWidth="2"/>
        <rect x="9" y="9" width="6" height="6" strokeWidth="2"/>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" strokeWidth="2"/>
      </svg>
    );

    const CheckCircleIcon = () => (
      <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const SparklesIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    );

    const ShieldCheckIcon = () => (
      <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const LeafIcon = () => (
      <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 20s0-8 8-12 8-4 8-4 0 8-4 12-8 4-12 4zM4 20c2-4 5-6 8-8" />
      </svg>
    );

    const WalletIcon = () => (
      <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm0 0V6a2 2 0 012-2h11M17 13h.01" />
      </svg>
    );

    const PulseIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12h4l2-7 4 14 2-7h6" />
      </svg>
    );

    // --- Shared numeric helper (module scope so visual primitives can use it) ---
    const num = (v, d = 0) => (v === null || v === undefined || isNaN(Number(v)) ? d : Number(v));

    /**
     * 4D Pareto frontier scatter plot.
     *
     * X = total time to result (min), Y = estimated cost (EUR),
     * bubble radius = Spot interruption risk, fill colour = carbon tier.
     * The dashed polyline joins the non-dominated (Pareto-optimal) plans.
     */
    function ParetoScatter({ plans, selectedPlanId, onSelect }) {
      const pts = (plans || []).filter((p) => p && p.plan_id);
      if (pts.length === 0) return null;

      const W = 680;
      const H = 300;
      const M = { top: 16, right: 20, bottom: 42, left: 62 };
      const iw = W - M.left - M.right;
      const ih = H - M.top - M.bottom;

      const timeOf = (p) => num(p.total_time_to_result_minutes || p.estimated_execution_minutes);
      const costOf = (p) => num(p.estimated_cost_eur);

      const xMax = Math.max(...pts.map(timeOf)) * 1.18 || 1;
      const yMax = Math.max(...pts.map(costOf)) * 1.18 || 1;

      const sx = (v) => M.left + (v / xMax) * iw;
      const sy = (v) => M.top + ih - (v / yMax) * ih;

      const carbonColor = (tier) =>
        tier === "LOW_CARBON" ? "#34d399" : tier === "HIGH_CARBON" ? "#fb923c" : "#38bdf8";

      // Risk drives the bubble radius so a cheap-but-fragile plan reads as fragile.
      const radiusOf = (p) => 6 + num(p.interruption_risk_score) * 14;

      const frontier = pts
        .filter((p) => p.is_pareto_optimal)
        .slice()
        .sort((a, b) => timeOf(a) - timeOf(b));

      const frontierPath = frontier
        .map((p, i) => (i === 0 ? "M" : "L") + " " + sx(timeOf(p)) + " " + sy(costOf(p)))
        .join(" ");

      const ratios = [0, 0.25, 0.5, 0.75, 1];

      return (
        <div className="space-y-2">
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto select-none" role="img">
            {/* Grid + Y axis ticks (cost) */}
            {ratios.map((r, i) => (
              <g key={`y${i}`}>
                <line
                  x1={M.left}
                  y1={M.top + ih - r * ih}
                  x2={M.left + iw}
                  y2={M.top + ih - r * ih}
                  stroke="#1e293b"
                  strokeWidth="1"
                />
                <text
                  x={M.left - 8}
                  y={M.top + ih - r * ih + 4}
                  textAnchor="end"
                  fontSize="10"
                  fill="#64748b"
                  fontFamily="JetBrains Mono, monospace"
                >
                  {(yMax * r).toFixed(1)}
                </text>
              </g>
            ))}

            {/* X axis ticks (time) */}
            {ratios.map((r, i) => (
              <text
                key={`x${i}`}
                x={M.left + r * iw}
                y={M.top + ih + 18}
                textAnchor="middle"
                fontSize="10"
                fill="#64748b"
                fontFamily="JetBrains Mono, monospace"
              >
                {(xMax * r).toFixed(0)}
              </text>
            ))}

            <text
              x={M.left + iw / 2}
              y={H - 6}
              textAnchor="middle"
              fontSize="11"
              fill="#94a3b8"
            >
              Time to result (min)
            </text>
            <text
              x={14}
              y={M.top + ih / 2}
              textAnchor="middle"
              fontSize="11"
              fill="#94a3b8"
              transform={`rotate(-90 14 ${M.top + ih / 2})`}
            >
              Estimated cost (€)
            </text>

            {/* Pareto frontier polyline */}
            {frontier.length > 1 && (
              <path d={frontierPath} fill="none" stroke="#22d3ee" strokeWidth="1.5" strokeDasharray="5 4" opacity="0.75" />
            )}

            {/* Plan bubbles */}
            {pts.map((p) => {
              const cx = sx(timeOf(p));
              const cy = sy(costOf(p));
              const isSel = p.plan_id === selectedPlanId;
              return (
                <g key={p.plan_id} onClick={() => onSelect && onSelect(p.plan_id)} style={{ cursor: "pointer" }}>
                  <title>
                    {`${p.title || p.plan_id}\n${fmtNum(costOf(p), 2)} € · ${fmtNum(timeOf(p), 1)} min\nSpot risk: ${(num(p.interruption_risk_score) * 100).toFixed(0)}%\nCarbon: ${fmtNum(p.carbon_emissions_g_co2, 1)} gCO₂ (${p.green_tier || "n/a"})`}
                  </title>
                  {isSel && (
                    <circle cx={cx} cy={cy} r={radiusOf(p) + 6} fill="none" stroke="#f1f5f9" strokeWidth="1.5" opacity="0.8" />
                  )}
                  <circle
                    cx={cx}
                    cy={cy}
                    r={radiusOf(p)}
                    fill={carbonColor(p.green_tier)}
                    fillOpacity={p.is_pareto_optimal ? 0.55 : 0.18}
                    stroke={carbonColor(p.green_tier)}
                    strokeWidth={p.is_pareto_optimal ? 2 : 1}
                    strokeDasharray={p.is_pareto_optimal ? "" : "3 3"}
                  />
                  {p.is_pareto_optimal && (
                    <text x={cx} y={cy - radiusOf(p) - 6} textAnchor="middle" fontSize="9" fill="#e2e8f0">
                      ★
                    </text>
                  )}
                </g>
              );
            })}
          </svg>

          <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[10px] text-slate-400">
            <span className="flex items-center gap-1.5">
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400/60 border border-emerald-400" />
              Low carbon
            </span>
            <span className="flex items-center gap-1.5">
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-sky-400/60 border border-sky-400" />
              Moderate carbon
            </span>
            <span className="flex items-center gap-1.5">
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-orange-400/60 border border-orange-400" />
              High carbon
            </span>
            <span>★ = non-dominated (Pareto frontier)</span>
            <span>Bubble radius ∝ Spot preemption risk</span>
          </div>
        </div>
      );
    }

    /** Linear gauge used for burn-rate drift and checkpoint exposure. */
    function DriftGauge({ label, value, max, unit, tone, caption }) {
      const pct = Math.max(0, Math.min(100, (num(value) / Math.max(num(max), 0.0001)) * 100));
      const bar =
        tone === "danger" ? "bg-rose-500" : tone === "warn" ? "bg-amber-400" : "bg-emerald-400";
      return (
        <div className="space-y-1">
          <div className="flex items-baseline justify-between text-xs">
            <span className="text-slate-400">{label}</span>
            <span className="font-mono text-slate-100">
              {fmtNum(value, 2)} {unit}
            </span>
          </div>
          <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div className={`h-full rounded-full transition-all duration-500 ${bar}`} style={{ width: `${pct}%` }} />
          </div>
          {caption && <div className="text-[10px] text-slate-500 leading-snug">{caption}</div>}
        </div>
      );
    }

    /** One row of the 3-tier financial reconciliation chart. */
    function ReconciliationBar({ label, value, max, colorClass, hint }) {
      const pct = Math.max(0, Math.min(100, (num(value) / Math.max(num(max), 0.0001)) * 100));
      return (
        <div className="space-y-1">
          <div className="flex items-baseline justify-between text-xs">
            <span className="text-slate-300">{label}</span>
            <span className="font-mono text-slate-100">{fmtNum(value, 2)} €</span>
          </div>
          <div className="w-full bg-slate-800 h-3 rounded-md overflow-hidden">
            <div className={`h-full rounded-md transition-all duration-700 ${colorClass}`} style={{ width: `${pct}%` }} />
          </div>
          {hint && <div className="text-[10px] text-slate-500">{hint}</div>}
        </div>
      );
    }

    /** Executive KPI tile for the FinOps board. */
    function KpiTile({ icon, label, value, unit, sub, tone }) {
      const ring =
        tone === "green"
          ? "border-emerald-800/60 bg-emerald-950/30"
          : tone === "amber"
          ? "border-amber-800/60 bg-amber-950/30"
          : "border-slate-800 bg-slate-900/90";
      return (
        <div className={`rounded-xl border p-4 shadow-sm space-y-1 ${ring}`}>
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            {icon}
            <span>{label}</span>
          </div>
          <div className="flex items-baseline space-x-1.5">
            <span className="text-2xl font-bold tracking-tight text-white font-mono">{value}</span>
            {unit && <span className="text-xs text-slate-400">{unit}</span>}
          </div>
          {sub && <div className="text-[11px] text-slate-400 leading-snug">{sub}</div>}
        </div>
      );
    }

    /** Module-scope formatter mirroring the in-component `fmt` helper. */
    function fmtNum(val, digits = 1, fallback = "0.0") {
      if (val === null || val === undefined || isNaN(Number(val))) return fallback;
      return Number(val).toFixed(digits);
    }

    function App() {
      const [objective, setObjective] = useState(
        "Run the compute workload autonomously. Meet its deadline and budget while minimizing cost. Continue observing and adapting until it finishes, then summarize the result."
      );
      const [deadline, setDeadline] = useState(25);
      const [budget, setBudget] = useState(5.0);
      const [minimizeCost, setMinimizeCost] = useState(true);

      const [snapshot, setSnapshot] = useState(null);
      const [slurmVerification, setSlurmVerification] = useState(null);
      const [capacityAdvice, setCapacityAdvice] = useState(null);
      const [loadingCapacity, setLoadingCapacity] = useState(false);
      const [runtimeType, setRuntimeType] = useState("loading...");
      const [isOptimizing, setIsOptimizing] = useState(false);
      const [streamLogs, setStreamLogs] = useState([]);
      const [finalSummary, setFinalSummary] = useState(null);
      const [copied, setCopied] = useState(false);

      const logsEndRef = useRef(null);

      const [activeTab, setActiveTab] = useState("mission"); // "mission", "plans", "capacity", "diagnostics", "history"
      const [controlMode, setControlMode] = useState("validation"); // "advisory", "validation", "delegation"
      const [delegationBudget, setDelegationBudget] = useState(10.0);
      const [approvedPlanId, setApprovedPlanId] = useState(null);

      const [planComparison, setPlanComparison] = useState(null);
      const [fallbackVerdict, setFallbackVerdict] = useState(null);
      const [fallbackPlanId, setFallbackPlanId] = useState(null);
      const [loadingPlans, setLoadingPlans] = useState(false);
      const [planError, setPlanError] = useState(null);

      const [capacityCandidates, setCapacityCandidates] = useState([]);
      const [loadingCandidates, setLoadingCandidates] = useState(false);
      const [capacityError, setCapacityError] = useState(null);
      // What the server says it actually searched. A single-region answer must
      // not be mistaken for an exhaustive one.
      const [capacityMeta, setCapacityMeta] = useState(null);

      const [diagnosticsList, setDiagnosticsList] = useState([]);
      const [loadingDiagnostics, setLoadingDiagnostics] = useState(false);
      const [diagnosticsError, setDiagnosticsError] = useState(null);

      const [historyRecords, setHistoryRecords] = useState([]);
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [historyError, setHistoryError] = useState(null);

      // Execution / approval feedback: always the server's own answer.
      const [approvalError, setApprovalError] = useState(null);
      const [approvingPlanId, setApprovingPlanId] = useState(null);
      const [executionResult, setExecutionResult] = useState(null);
      const [executingPlanId, setExecutingPlanId] = useState(null);
      const [serverControl, setServerControl] = useState(null);
      const [modeSyncError, setModeSyncError] = useState(null);

      // Requested workload size. Kept independent of budget and deadline so a
      // single field can be changed and transmitted on its own.
      const [cpuRequested, setCpuRequested] = useState(16);
      const [memoryGbRequested, setMemoryGbRequested] = useState(32);
      // Location constraints. The API used to drop them silently, so the field
      // exists only now that the backend honours it.
      const [allowedRegions, setAllowedRegions] = useState("");
      const [allowRegionChange, setAllowRegionChange] = useState(false);

      // --- Executive FinOps / GreenOps board (/api/portfolio/finops) ---
      const [finops, setFinops] = useState(null);
      const [loadingFinops, setLoadingFinops] = useState(false);
      const [finopsError, setFinopsError] = useState(null);

      // --- Live drift & anomaly monitor (/api/workloads/{id}/anomalies) ---
      const [anomalyReport, setAnomalyReport] = useState(null);
      const [loadingAnomalies, setLoadingAnomalies] = useState(false);
      const [anomaliesError, setAnomaliesError] = useState(null);

      // --- Interactive What-If stress controls (/api/plans/what-if) ---
      // Seeded with the same defaults the backend uses so the first render
      // matches the summary already embedded in the plan comparison.
      const [whatIfPreemptions, setWhatIfPreemptions] = useState(2);
      const [whatIfBudgetShock, setWhatIfBudgetShock] = useState(-20);
      const [whatIfDeadlineCompression, setWhatIfDeadlineCompression] = useState(-25);
      const [whatIfResult, setWhatIfResult] = useState(null);
      const [loadingWhatIf, setLoadingWhatIf] = useState(false);
      const [whatIfError, setWhatIfError] = useState(null);

      // Plan selected on the Pareto scatter; drives the highlighted plan card.
      const [selectedPlanId, setSelectedPlanId] = useState(null);

      // Impact-preview modal shown before any actuation leaves the browser.
      const [pendingExecution, setPendingExecution] = useState(null);

      const WORKLOAD_ID = "workload-gui";

      // Build the profile from the *current* form values. It used to be
      // hard-coded, so changing only the budget changed nothing server-side.
      const buildWorkloadProfile = () => ({
        workload_id: WORKLOAD_ID,
        name: "compute-simulation",
        cpu_requested: Number(cpuRequested),
        memory_mb_requested: Math.round(Number(memoryGbRequested) * 1024),
        deadline_minutes_from_start: Number(deadline),
        budget_amount: Number(budget),
        is_parallelizable: true,
        supports_checkpointing: true,
        checkpoint_location: "gs://agentgrid-checkpoints/workload-gui",
      });

      const describeError = async (res, fallback) => {
        try {
          const body = await res.json();
          if (body && body.detail) return `HTTP ${res.status}: ${body.detail}`;
        } catch (e) {
          /* body was not JSON */
        }
        return `${fallback} (HTTP ${res.status})`;
      };

      const fetchCapacityCandidates = async () => {
        setLoadingCandidates(true);
        setCapacityError(null);
        try {
          const res = await fetch(`${API_BASE}/api/capacity-search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              cpu_requested: Number(cpuRequested),
              memory_gb_requested: Number(memoryGbRequested),
              allowed_regions: allowedRegions
                .split(",")
                .map((r) => r.trim())
                .filter((r) => r.length > 0),
              allow_region_change: allowRegionChange,
            }),
          });
          if (!res.ok) {
            setCapacityError(await describeError(res, "Capacity search failed"));
            setCapacityCandidates([]);
            setCapacityMeta(null);
            return;
          }
          const data = await res.json();
          setCapacityCandidates(data.candidates || []);
          setCapacityMeta({
            searched_regions: data.searched_regions || (data.searched_region ? [data.searched_region] : []),
            allowed_regions: data.allowed_regions || [],
            allow_region_change: data.allow_region_change,
            location_note: data.location_note,
          });
        } catch (e) {
          setCapacityError(`Unable to reach the API: ${e.message}`);
          setCapacityCandidates([]);
          setCapacityMeta(null);
        } finally {
          setLoadingCandidates(false);
        }
      };

      const fetchPlanComparison = async () => {
        setLoadingPlans(true);
        setPlanError(null);
        try {
          const res = await fetch(`${API_BASE}/api/plans/compare`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              workload_profile: buildWorkloadProfile(),
              cluster_total_cpu: 128,
            }),
          });
          if (!res.ok) {
            setPlanError(await describeError(res, "Plan comparison failed"));
            setPlanComparison(null);
            return;
          }
          setPlanComparison(await res.json());
        } catch (e) {
          setPlanError(`Unable to reach the API: ${e.message}`);
          setPlanComparison(null);
        } finally {
          setLoadingPlans(false);
        }
      };

      const handleApprovePlan = async (planId) => {
        setApprovalError(null);
        setApprovingPlanId(planId);
        try {
          const res = await fetch(`${API_BASE}/api/plans/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ plan_id: planId, workload_id: WORKLOAD_ID }),
          });
          if (!res.ok) {
            // Never show an approval the server did not record.
            setApprovedPlanId(null);
            setApprovalError(await describeError(res, "Approval refused"));
            return;
          }
          const body = await res.json();
          if (body.status === "approved") {
            setApprovedPlanId(planId);
          } else {
            setApprovedPlanId(null);
            setApprovalError(body.reason || `Approval refused: ${body.status}`);
          }
        } catch (e) {
          setApprovedPlanId(null);
          setApprovalError(`Unable to reach the API: ${e.message}`);
        } finally {
          setApprovingPlanId(null);
        }
      };

      const handleExecutePlan = async (plan) => {
        setExecutionResult(null);
        setExecutingPlanId(plan.plan_id);
        try {
          const res = await fetch(`${API_BASE}/api/execute-plan`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              workload_profile: buildWorkloadProfile(),
              plan: plan,
              control_mode: controlMode,
              delegation_policy: { max_budget_eur: Number(delegationBudget) },
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setExecutionResult({
              status: "error",
              reason: body.detail || `Execution request refused (HTTP ${res.status})`,
            });
            return;
          }
          // Display exactly what the server returned, including "blocked".
          setExecutionResult(body);
          if (body.status === "submitted" || body.status === "already_submitted") {
            fetchHistory();
          }
        } catch (e) {
          setExecutionResult({ status: "error", reason: `Unable to reach the API: ${e.message}` });
        } finally {
          setExecutingPlanId(null);
        }
      };

      const handleProposeFallback = async (plan) => {
        setFallbackVerdict(null);
        setFallbackPlanId(plan.plan_id);
        try {
          const res = await fetch(`${API_BASE}/api/workloads/${WORKLOAD_ID}/fallback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              current_plan: plan,
              failure_category: "spot_preemption",
              workload_profile: buildWorkloadProfile(),
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setFallbackVerdict({
              status: "error",
              reason: body.detail || `Fallback request refused (HTTP ${res.status})`,
            });
            return;
          }
          // Show the server's verdict verbatim, including a refusal.
          setFallbackVerdict(body);
        } catch (e) {
          setFallbackVerdict({ status: "error", reason: `Unable to reach the API: ${e.message}` });
        } finally {
          setFallbackPlanId(null);

      const fetchDiagnostics = async () => {
        setLoadingDiagnostics(true);
        setDiagnosticsError(null);
        try {
          const q = snapshot?.workload
            ? `?job_state=${snapshot.workload.status || "RUNNING"}`
            : "?job_state=PENDING&state_reason=ReqNodeNotAvail";
          const res = await fetch(`${API_BASE}/api/diagnose${q}`);
          if (!res.ok) {
            setDiagnosticsError(await describeError(res, "Diagnostics failed"));
            setDiagnosticsList([]);
            return;
          }
          const data = await res.json();
          setDiagnosticsList(data.diagnostics || []);
        } catch (e) {
          setDiagnosticsError(`Unable to reach the API: ${e.message}`);
          setDiagnosticsList([]);
        } finally {
          setLoadingDiagnostics(false);
        }
      };

      const fetchHistory = async () => {
        setLoadingHistory(true);
        setHistoryError(null);
        try {
          const res = await fetch(`${API_BASE}/api/history`);
          if (!res.ok) {
            setHistoryError(await describeError(res, "History unavailable"));
            setHistoryRecords([]);

          const data = await res.json();
          setHistoryRecords(data.records || []);

      // Fleet-wide FinOps, 3-tier reconciliation and carbon telemetry. The
      // backend has computed these since the analytics module landed; nothing
      // in the UI read them, so the ROI of Spot hedging stayed invisible.
      const fetchFinops = async () => {
        setLoadingFinops(true);
        setFinopsError(null);
        try {
          const res = await fetch(`${API_BASE}/api/portfolio/finops`);
          if (!res.ok) {
            setFinopsError(await describeError(res, "Portfolio FinOps unavailable"));
            setFinops(null);
            return;
          }
          setFinops(await res.json());
        } catch (e) {
          setFinopsError(`Unable to reach the API: ${e.message}`);
          setFinops(null);
        } finally {
          setLoadingFinops(false);
        }
      };

      // Live drift detection. Elapsed time, cost and progress are taken from the
      // runtime snapshot so the report describes the run actually observed, not
      // the one the form describes.
      const fetchAnomalies = async () => {
        setLoadingAnomalies(true);
        setAnomaliesError(null);
        try {
          const wl = (snapshot && snapshot.workload) || {};
          const clk = (snapshot && snapshot.cluster) || {};
          const body = {
            workload_profile: buildWorkloadProfile(),
            elapsed_minutes: num(clk.current_time_minutes),
            current_cost_eur: num(wl.accrued_cost_eur),
          };
          if (wl.remaining_work_units !== undefined && wl.remaining_work_units !== null) {
            body.progress_pct = Math.max(0, Math.min(100, 100 - num(wl.remaining_work_units)));
          }
          const res = await fetch(`${API_BASE}/api/workloads/${WORKLOAD_ID}/anomalies`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            setAnomaliesError(await describeError(res, "Anomaly detection failed"));
            setAnomalyReport(null);
            return;
          }
          setAnomalyReport(await res.json());
        } catch (e) {
          setAnomaliesError(`Unable to reach the API: ${e.message}`);
          setAnomalyReport(null);
        } finally {
          setLoadingAnomalies(false);
        }
      };

      // Re-run the stress simulator with the operator's own shock parameters.
      // Plans are sent explicitly so the scenarios apply to exactly the set the
      // page is displaying, even before anything has been registered.
      const runWhatIf = async (plansOverride) => {
        const plans = plansOverride || (planComparison && planComparison.plans) || [];
        if (plans.length === 0) {
          setWhatIfError("Compare plans first: there is no plan to stress-test.");
          setWhatIfResult(null);
          return;
        }
        setLoadingWhatIf(true);
        setWhatIfError(null);
        try {
          const res = await fetch(`${API_BASE}/api/plans/what-if`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              workload_id: WORKLOAD_ID,
              plans: plans,
              workload_profile: buildWorkloadProfile(),
              forced_preemptions: Number(whatIfPreemptions),
              budget_shock_pct: Number(whatIfBudgetShock),
              deadline_compression_pct: Number(whatIfDeadlineCompression),
            }),
          });
          if (!res.ok) {
            setWhatIfError(await describeError(res, "What-If simulation failed"));
            setWhatIfResult(null);
            return;
          }
          setWhatIfResult(await res.json());
        } catch (e) {
          setWhatIfError(`Unable to reach the API: ${e.message}`);
          setWhatIfResult(null);
        } finally {
          setLoadingWhatIf(false);
        }
      };

      // The control mode is enforced by the server, so the selector must push
      // it there. Showing a mode the backend does not hold would be a lie.
      const syncControlMode = async (mode, budgetEur) => {
        setModeSyncError(null);
        try {
          const res = await fetch(`${API_BASE}/api/workloads/${WORKLOAD_ID}/control`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              control_mode: mode,
              delegation_policy: { max_budget_eur: Number(budgetEur) },

          if (!res.ok) {
            setModeSyncError(await describeError(res, "Could not set the control mode"));
            return;
          }
          setServerControl(await res.json());
        } catch (e) {
          setModeSyncError(`Unable to reach the API: ${e.message}`);
        }
      };

      const applyControlMode = (mode) => {
        setControlMode(mode);
        syncControlMode(mode, delegationBudget);
      };

      useEffect(() => {
        syncControlMode(controlMode, delegationBudget);
      }, []);

      useEffect(() => {
        if (activeTab === "plans" && !planComparison && !loadingPlans) fetchPlanComparison();
        if (activeTab === "capacity" && capacityCandidates.length === 0 && !loadingCandidates)
          fetchCapacityCandidates();
        if (activeTab === "diagnostics" && diagnosticsList.length === 0 && !loadingDiagnostics)
          fetchDiagnostics();
        if (activeTab === "history" && historyRecords.length === 0 && !loadingHistory) fetchHistory();
        if (activeTab === "finops" && !finops && !loadingFinops) fetchFinops();
        // The health ribbon belongs to the mission view, so it loads with it.
        if (activeTab === "mission" && !anomalyReport && !loadingAnomalies) fetchAnomalies();
      }, [activeTab]);


      // Support direct connection when testing locally or on cloudtop
      const API_BASE = (window.location.origin && !window.location.origin.startsWith("file://")) ? "" : "https://agentic-compute-agent-340107663828.us-central1.run.app";

      // Fetch snapshot from API
      const fetchSnapshot = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/snapshot`);
          if (res.ok) {
            const data = await res.json();
            if (data.snapshot) {
              setSnapshot(data.snapshot);
              setRuntimeType(data.runtime || "slurm");
              setSlurmVerification(data.slurm_verification || null);

      };

      // Fetch capacity advisor data from API
      const fetchCapacityAdvice = async () => {
        setLoadingCapacity(true);
        try {
          const res = await fetch(`${API_BASE}/api/capacity-advice`);
          if (res.ok) {
            const data = await res.json();
            setCapacityAdvice(data);
          }
        } catch (e) {
          console.error("Failed to fetch capacity advice:", e);
        } finally {
          setLoadingCapacity(false);
        }
      };

      useEffect(() => {
        fetchSnapshot();
        fetchCapacityAdvice();
        const interval = setInterval(fetchSnapshot, 6000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {

      const handlePreset = (text, d, b) => {

      };

      const handleReset = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/reset`, { method: "POST" });
          if (res.ok) {

            setSnapshot(data.snapshot);
            setStreamLogs([]);
            setFinalSummary(null);
            fetchCapacityAdvice();
          }
        } catch (e) {
          console.error("Reset error:", e);
        }
      };

      const copyCommand = (cmd) => {
        navigator.clipboard.writeText(cmd);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const runOptimization = async () => {
        if (isOptimizing) return;
        setIsOptimizing(true);
        setStreamLogs([]);
        setFinalSummary(null);

        // Build tailored prompt incorporating structured sliders if altered
        let finalPrompt = objective;
        if (!finalPrompt.includes(String(deadline)) && deadline !== 25) {
          finalPrompt += ` Deadline is ${deadline} minutes. Max budget is ${budget} EUR. Minimize cost: ${minimizeCost}.`;
        }

        try {
          const response = await fetch(`${API_BASE}/optimize/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ objective: finalPrompt }),
          });

          if (!response.body) {
            throw new Error("ReadableStream not supported");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop(); // Keep incomplete chunk

            for (const block of lines) {
              const trimmed = block.trim();
              if (!trimmed.startsWith("data:")) continue;

              try {
                const payload = JSON.parse(trimmed.replace(/^data:\s*/, ""));
                
                if (payload.event === "started") {
                  setStreamLogs(prev => [...prev, { type: "system", text: `Session started (${payload.session_id}) using ${payload.model}` }]);
                } else if (payload.event === "tool_call") {
                  setStreamLogs(prev => [...prev, { type: "tool_call", tool: payload.tool, args: payload.args, time: payload.timestamp }]);
                } else if (payload.event === "tool_response") {
                  if (payload.response && payload.response.snapshot) {
                    setSnapshot(payload.response.snapshot);
                  }
                  if (payload.response && payload.response.slurm_verification) {
                    setSlurmVerification(payload.response.slurm_verification);
                  }
                } else if (payload.event === "thinking") {
                  setStreamLogs(prev => [...prev, { type: "thinking", text: payload.text, time: payload.timestamp }]);
                } else if (payload.event === "completed") {
                  setFinalSummary(payload.summary);
                  setStreamLogs(prev => [...prev, { type: "completed", text: `Optimization finished in ${payload.duration_seconds}s.` }]);
                  fetchSnapshot();
                } else if (payload.event === "error") {
                  setStreamLogs(prev => [...prev, { type: "error", text: payload.error }]);
                }
              } catch (err) {
                console.error("Error parsing event line:", err);
              }
            }
          }
        } catch (err) {
          setStreamLogs(prev => [...prev, { type: "error", text: `Connection error: ${err.message}` }]);
        } finally {
          setIsOptimizing(false);
          fetchSnapshot();
          fetchCapacityAdvice();
        }
      };

      const fmt = (val, digits = 1, fallback = "0.0") => {
        if (val === null || val === undefined || isNaN(Number(val))) return fallback;
        return Number(val).toFixed(digits);
      };

      const cluster = (snapshot && snapshot.cluster) ? snapshot.cluster : { total_cpu: 128, free_cpu: 96, current_time_minutes: 0, total_gpu: 0 };
      const workload = (snapshot && snapshot.workload) ? snapshot.workload : { id: "1", remaining_work_units: 100, allocated_cpu: 4, accrued_cost_eur: 0, estimated_remaining_minutes: 25.0, done: false };
      const candidates = (snapshot && snapshot.candidate_allocations) ? snapshot.candidate_allocations : [];

      const progressPct = Math.max(0, Math.min(100, 100 - (workload.remaining_work_units || 0)));
      const budgetPct = snapshot && snapshot.objective && snapshot.objective.max_cost_eur
        ? Math.min(100, ((workload.accrued_cost_eur || 0) / snapshot.objective.max_cost_eur) * 100)
        : 10;

      return (
        <div className="flex-1 flex flex-col max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
          {/* Header */}

              <div>

                    v0.2.0

            </div>

            <div className="flex flex-wrap items-center gap-3 text-xs">
              <div className="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800">
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span className="text-slate-300 font-medium">Cloud Run Live</span>
                <span className="text-slate-600">|</span>
                <span className="text-cyan-400 font-mono">gemini-2.5-flash</span>
                <span className="text-slate-600">|</span>
                <span className="text-amber-400 font-mono uppercase">{runtimeType}</span>

              <a

              <a

              >

                  <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
              </a>
            </div>
          </header>

          {/* 6-Feature Navigation & Mode Bar */}
          <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 bg-slate-900/90 border border-slate-800 rounded-xl p-2 shadow-lg backdrop-blur">

              <button

                            <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-cyan-950 text-cyan-400 border border-cyan-800/60">
                              Rank {m.rank}
                            </span>
                            <span className="text-slate-100 font-semibold">{m.machine_type}</span>
                          </div>
                          <div className="flex items-center space-x-1.5">
                            <span className="text-slate-400 text-[11px]">Obtainability:</span>
                            {(() => {
                              const score = (m.obtainability_score !== undefined && m.obtainability_score !== null)
                                ? m.obtainability_score
                                : ((m.obtainability !== undefined && m.obtainability !== null) ? m.obtainability : null);
                              const percent = (m.obtainability_percent !== undefined && m.obtainability_percent !== null)
                                ? m.obtainability_percent
                                : (score !== null ? Math.round(score * 100) : null);
                              return (
                                <span className={`font-bold ${score !== null && score >= 0.85 ? 'text-emerald-400' : (score !== null ? 'text-amber-400' : 'text-slate-500')}`}>
                                  {percent !== null ? `${percent}%` : 'N/D'}
                                </span>
                              );
                            })()}
                          </div>
                        </div>
                        <div className="flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-900 pt-1">
                          <span>Zone: <span className="text-cyan-300">{m.recommended_zone || m.zone || 'N/D'}</span></span>
                          {(() => {
                            const pr = (m.historical_preemption_rate_7d !== undefined && m.historical_preemption_rate_7d !== null)
                              ? m.historical_preemption_rate_7d
                              : ((m.historical_preemption_rate_7d_avg !== undefined && m.historical_preemption_rate_7d_avg !== null) ? m.historical_preemption_rate_7d_avg : null);
                            return (
                              <span>7d Preempt: <span className={pr !== null ? (pr < 0.15 ? 'text-emerald-400' : (pr < 0.25 ? 'text-amber-400' : 'text-rose-400')) : 'text-slate-500'}>
                                {pr !== null ? `${(pr * 100).toFixed(1)}%` : 'N/D'}
                              </span></span>
                            );
                          })()}
                          {(() => {
                            const mins = (m.estimated_uptime_minutes !== undefined && m.estimated_uptime_minutes !== null)
                              ? m.estimated_uptime_minutes
                              : (m.estimated_uptime ? (parseFloat(m.estimated_uptime) / 60.0) : null);
                            return (
                              <span>Est. Uptime: <span className={mins !== null && !isNaN(mins) ? 'text-slate-300' : 'text-slate-500'}>
                                {mins !== null && !isNaN(mins) ? `${Math.round(mins)}m` : 'N/D'}
                              </span></span>
                            );
                          })()}
                        </div>
                        <div className="flex items-center justify-between text-[10px] text-slate-500 pt-0.5">
                          <span>Hedging Mix:</span>
                          <span className="text-cyan-400 font-semibold">{m.suggested_hedging || m.hedged_policy_recommendation || '100% Spot'}</span>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="text-xs text-slate-500 py-3 font-mono text-center">Loading Compute Engine advice...</div>
                  )}
                </div>

                {/* Hedging Policy Formula Explanation */}
                <div className="bg-cyan-950/25 border border-cyan-900/40 rounded-lg p-2.5 text-[11px] text-slate-300 space-y-1">
                  <div className="font-semibold text-cyan-400 flex items-center justify-between">
                    <span>⚡ Autonomous Hedging Policy</span>
                    <span className="font-mono text-slate-400">Slack Ratio S = (D - T) / ETA</span>
                  </div>
                  <div className="text-slate-400 leading-tight space-y-0.5 font-sans pt-0.5">
                    <div>• <span className="text-emerald-300 font-medium font-mono">S &gt; 1.5</span>: 100% Spot (Maximizes cost savings)</div>
                    <div>• <span className="text-cyan-300 font-medium font-mono">1.1 &lt; S &le; 1.5</span>: 80% Spot / 20% Standard hedge buffer</div>
                    <div>• <span className="text-rose-300 font-medium font-mono">S &le; 1.1</span>: 100% Standard On-Demand (Zero SLA breach)</div>
                  </div>
                </div>
              </div>

            </div>

            {/* Right Column (7 cols): Live Streaming & Candidate Table */}
            <div className="lg:col-span-7 space-y-6">

              {/* Real-time Agent Reasoning Stream */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-sm flex flex-col h-[380px]">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center space-x-2">
                    <div className={`h-2.5 w-2.5 rounded-full ${isOptimizing ? 'bg-cyan-400 pulse-ring' : 'bg-slate-600'}`}></div>
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-300">
                      Live Closed-Loop Reasoning Stream
                    </span>
                  </div>
                  <span className="text-xs text-slate-400 font-mono">
                    {isOptimizing ? "Streaming Gemini Events..." : "Idle"}
                  </span>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3 font-mono text-xs">
                  {streamLogs.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-slate-600 space-y-2">
                      <CpuIcon />
                      <p>Click "Launch Autonomous Optimization" to observe real-time Gemini decisions.</p>
                    </div>
                  ) : (
                    streamLogs.map((log, idx) => {
                      if (log.type === "tool_call") {
                        return (
                          <div key={idx} className="bg-slate-950 border border-cyan-900/40 rounded-lg p-2.5 space-y-1">
                            <div className="flex items-center justify-between text-cyan-400 font-semibold">
                              <span>⚡ Tool Invocation: {log.tool}</span>
                              <span className="text-slate-400 text-xs font-normal">+{log.time}s</span>
                            </div>
                            <pre className="text-slate-300 text-[11px] overflow-x-auto bg-slate-900/80 p-1.5 rounded">
                              {JSON.stringify(log.args, null, 2)}
                            </pre>
                          </div>
                        );
                      }
                      if (log.type === "thinking") {
                        return (
                          <div key={idx} className="border-l-2 border-slate-700 pl-3 py-1 text-slate-300 leading-relaxed font-sans text-xs">
                            {log.text}
                          </div>
                        );
                      }
                      if (log.type === "completed") {
                        return (
                          <div key={idx} className="bg-emerald-950/40 border border-emerald-800 rounded-lg p-3 text-emerald-300 font-sans text-xs flex items-center space-x-2">
                            <CheckCircleIcon />
                            <span>{log.text}</span>
                          </div>
                        );
                      }
                      return (
                        <div key={idx} className="text-slate-400">
                          {log.text}
                        </div>
                      );
                    })
                  )}
                  <div ref={logsEndRef} />
                </div>

                {finalSummary && (
                  <div className="mt-2 pt-2 border-t border-slate-800">
                    <details className="text-xs text-slate-300 cursor-pointer" open>
                      <summary className="font-semibold text-cyan-400 mb-1">Final Optimization Summary</summary>
                      <div className="text-slate-300 font-sans whitespace-pre-line text-xs bg-slate-950 p-2.5 rounded border border-slate-800 max-h-32 overflow-y-auto custom-scrollbar">
                        {finalSummary}
                      </div>
                    </details>
                  </div>
                )}
              </div>

              {/* Candidate Allocation Matrix */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-sm space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300">
                    Deterministic Candidate Allocations
                  </h3>
                  <span className="text-xs text-slate-400">Computed via Amdahl's Law</span>
                </div>

                <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full text-left text-xs font-mono">
                    <thead>
                      <tr className="text-slate-400 border-b border-slate-800">
                        <th className="pb-2 font-medium">CPUs</th>
                        <th className="pb-2 font-medium">Machine & Mix</th>
                        <th className="pb-2 font-medium">Obtainability</th>
                        <th className="pb-2 font-medium">Est. ETA</th>
                        <th className="pb-2 font-medium">Finish Time</th>
                        <th className="pb-2 font-medium">Projected Cost</th>
                        <th className="pb-2 font-medium">Deadline</th>
                        <th className="pb-2 font-medium">Budget</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-850">
                      {candidates.map((c) => {
                        const isCurrent = c.cpu === workload.allocated_cpu;
                        return (
                          <tr
                            key={c.cpu}
                            className={`transition-colors ${
                              isCurrent
                                ? 'bg-cyan-950/40 text-cyan-200 font-semibold'
                                : 'hover:bg-slate-800/40 text-slate-300'
                            }`}
                          >
                            <td className="py-2.5 flex items-center space-x-1.5">
                              {isCurrent && <span className="h-1.5 w-1.5 rounded-full bg-cyan-400"></span>}
                              <span>{c.cpu} CPUs</span>
                            </td>
                            <td className="py-2.5">
                              <div className="flex flex-col">
                                <span className="font-semibold text-slate-200">
                                  {c.machine_type || (c.cpu >= 64 ? "n4-standard-32" : "n2-standard-32")}{" "}
                                  <span className="text-[10px] text-cyan-400 font-sans">#R{c.rank || (c.cpu >= 64 ? 1 : 2)}</span>
                                </span>
                                <span className="text-[10px] text-slate-400 font-sans">
                                  {c.provisioning_mix || (c.cpu <= 32 ? "100% Spot" : "80% Spot / 20% Std")}
                                </span>
                              </div>
                            </td>
                            <td className="py-2.5">
                              {(c.obtainability_score !== null && c.obtainability_score !== undefined) ? (
                                <span className={`font-bold ${c.obtainability_score >= 0.85 ? 'text-emerald-400' : 'text-amber-400'}`}>
                                  {Math.round(c.obtainability_score * 100)}%
                                </span>
                              ) : (
                                <span className="text-slate-500">—</span>
                              )}
                            </td>
                            <td className="py-2.5">{fmt(c.estimated_remaining_minutes, 1)}m</td>
                            <td className="py-2.5">{fmt(c.projected_finish_at_minutes, 1)}m</td>
                            <td className="py-2.5">€{fmt(c.projected_total_cost_eur, 3, "0.000")}</td>
                            <td className="py-2.5">
                              {c.meets_deadline ? (
                                <span className="text-emerald-400">✓ Meets</span>
                              ) : (
                                <span className="text-rose-400">✗ Misses</span>
                              )}
                            </td>
                            <td className="py-2.5">
                              {c.within_budget ? (
                                <span className="text-emerald-400">✓ In Budget</span>
                              ) : (
                                <span className="text-rose-400">✗ Over</span>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>

          </div>
          )}

          {/* ---------------------------------------------------------------
              Plan comparison (feature 3) + approval and execution (feature 4)
              --------------------------------------------------------------- */}
          {activeTab === 'plans' && (
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                  Plan comparison — cost, latency, capacity
                </h2>
                <button
                  onClick={fetchPlanComparison}
                  disabled={loadingPlans}
                  className="px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 disabled:opacity-50"
                >
                  {loadingPlans ? "Computing…" : "Recompute with current parameters"}
                </button>
              </div>

              <p className="text-xs text-slate-400">
                Budget <span className="text-cyan-300 font-mono">{budget} €</span>, deadline{" "}
                <span className="text-cyan-300 font-mono">{deadline} min</span>, {cpuRequested} vCPU,{" "}
                {memoryGbRequested} GB. Server-applied mode:{" "}
                <span className="text-amber-300 font-mono">
                  {serverControl ? serverControl.control_mode : "…"}
                </span>
              </p>

              {loadingPlans && (
                <div className="text-sm text-slate-400 py-8 text-center">Evaluating plans…</div>
              )}

              {!loadingPlans && planError && (
                <div className="rounded-lg border border-rose-500/40 bg-rose-500/10 p-4 text-sm text-rose-200">
                  <div className="font-semibold mb-1">Comparison unavailable</div>
                  <div className="font-mono text-xs break-words">{planError}</div>
                </div>
              )}

              {!loadingPlans && !planError && planComparison && !planComparison.is_feasible && (
                <div className="rounded-lg border border-amber-500/40 bg-amber-500/10 p-4 text-sm text-amber-100 space-y-2">
                  <div className="font-semibold">No plan satisfies the declared constraints</div>
                  {(planComparison.blocking_constraints || []).map((b, i) => (
                    <div key={i} className="text-xs font-mono">• {typeof b === "string" ? b : JSON.stringify(b)}</div>
                  ))}
                  {(planComparison.suggested_relaxations || []).length > 0 && (
                    <div className="pt-2">
                      <div className="font-semibold text-xs uppercase tracking-wider">Possible relaxations</div>
                      {planComparison.suggested_relaxations.map((r, i) => (
                        <div key={i} className="text-xs font-mono">• {typeof r === "string" ? r : JSON.stringify(r)}</div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {!loadingPlans && !planError && planComparison && planComparison.is_feasible && (
                <div className="space-y-3">
                  {approvalError && (
                    <div className="rounded-lg border border-rose-500/40 bg-rose-500/10 p-3 text-xs text-rose-200">
                      Approval refused: <span className="font-mono">{approvalError}</span>
                    </div>
                  )}
                  {executionResult && (
                    <div
                      className={`rounded-lg border p-3 text-xs ${
                        executionResult.status === "submitted"
                          ? "border-emerald-500/40 bg-emerald-500/10 text-emerald-200"
                          : executionResult.status === "already_submitted"
                          ? "border-sky-500/40 bg-sky-500/10 text-sky-200"
                          : "border-amber-500/40 bg-amber-500/10 text-amber-100"
                      }`}
                    >
                      <div className="font-semibold uppercase tracking-wider">{executionResult.status}</div>
                      <div className="font-mono break-words">{executionResult.reason}</div>
                      {executionResult.job_id && (
                        <div className="font-mono mt-1">job_id : {executionResult.job_id}</div>
                      )}
                      {executionResult.attempt_id && (
                        <div className="font-mono">attempt_id : {executionResult.attempt_id}</div>
                      )}
                      {executionResult.control_mode && (
                        <div className="font-mono">applied mode: {executionResult.control_mode}</div>
                      )}
                      {executionResult.history_linked === false && (
                        <div className="text-rose-300 font-mono mt-1">
                          tracking not linked to history: {executionResult.history_link_error}
                        </div>
                      )}
                    </div>
                  )}

                  {/* 4D Pareto frontier. The dominance analysis was already
                      computed server-side and surfaced only as a text badge;
                      plotted, the trade-off between a cheap fragile plan and a
                      fast green one becomes readable at a glance. */}
                  <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-4 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300">
                        4D Pareto frontier — cost × time × Spot risk × carbon
                      </h3>
                      {planComparison.pareto_frontier && (
                        <span className="text-[11px] font-mono text-slate-400">
                          {planComparison.pareto_frontier.pareto_optimal_count} non-dominated out of{" "}
                          {planComparison.pareto_frontier.total_evaluated}
                        </span>
                      )}
                    </div>

                    <ParetoScatter
                      plans={planComparison.plans}
                      selectedPlanId={selectedPlanId}
                      onSelect={setSelectedPlanId}
                    />

                    {planComparison.pareto_frontier &&
                      planComparison.pareto_frontier.recommendations_by_objective && (
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-2 pt-2 border-t border-slate-800">
                          {[
                            ["min_cost", "Lowest cost"],
                            ["min_latency", "Fastest"],
                            ["max_resilience", "Most resilient"],
                            ["min_carbon", "Greenest"],
                            ["balanced_utility", "Best trade-off"],
                          ].map(([key, label]) => {
                            const pid =
                              planComparison.pareto_frontier.recommendations_by_objective[key];
                            if (!pid) return null;
                            return (
                              <button
                                key={key}
                                onClick={() => setSelectedPlanId(pid)}
                                className={`text-left px-2 py-1.5 rounded-lg border transition-colors ${
                                  selectedPlanId === pid
                                    ? "border-cyan-500/50 bg-cyan-500/10"
                                    : "border-slate-800 hover:border-slate-700 hover:bg-slate-900"
                                }`}
                              >
                                <div className="text-[10px] uppercase tracking-wider text-slate-400">
                                  {label}
                                </div>
                                <div className="text-[11px] font-mono text-cyan-300 truncate">{pid}</div>
                              </button>
                            );
                          })}
                        </div>
                      )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {planComparison.plans.map((plan) => (
                      <div
                        key={plan.plan_id}
                        onClick={() => setSelectedPlanId(plan.plan_id)}
                        className={`rounded-xl border p-4 space-y-2 cursor-pointer transition-all ${
                          selectedPlanId === plan.plan_id
                            ? "border-cyan-400/70 bg-cyan-500/5 ring-1 ring-cyan-400/40"
                            : approvedPlanId === plan.plan_id
                            ? "border-emerald-500/50 bg-emerald-500/5"
                            : "border-slate-800 bg-slate-950/60 hover:border-slate-700"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <div className="text-xs uppercase tracking-wider text-cyan-300">{plan.plan_type}</div>
                          {plan.is_pareto_optimal && (
                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-950/90 text-emerald-300 border border-emerald-700/60 font-mono">
                              ★ Pareto Optimal
                            </span>
                          )}
                        </div>
                        <div className="text-sm font-semibold text-slate-100">{plan.title}</div>
                        <div className="text-xs text-slate-400 font-mono">{plan.plan_id}</div>
                        <dl className="text-xs text-slate-300 space-y-1 pt-2">
                          <div className="flex justify-between">
                            <dt>Estimated cost</dt>
                            <dd className="font-mono text-cyan-300">{fmt(plan.estimated_cost_eur, 2)} €</dd>
                          </div>
                          {plan.expected_cost_with_preemption_eur !== undefined && plan.expected_cost_with_preemption_eur !== null && (
                            <div className="flex justify-between">
                              <dt title="Expected cost including Spot preemption overhead (Young-Daly model)">Expected cost (Spot/restart)</dt>
                              <dd className="font-mono text-sky-300">{fmt(plan.expected_cost_with_preemption_eur, 2)} €</dd>
                            </div>
                          )}
                          <div className="flex justify-between">
                            <dt>Total latency</dt>
                            <dd className="font-mono">{fmt(plan.total_time_to_result_minutes, 1)} min</dd>
                          </div>
                          <div className="flex justify-between">
                            <dt>Forme</dt>
                            <dd className="font-mono">{plan.machine_type} · {plan.cpu} vCPU</dd>
                          </div>
                          <div className="flex justify-between">
                            <dt>Approvisionnement</dt>
                            <dd className="font-mono">{plan.provisioning_model}</dd>
                          </div>
                          {plan.carbon_emissions_g_co2 !== undefined && (
                            <div className="flex justify-between">
                              <dt>Carbon footprint</dt>
                              <dd className={`font-mono ${plan.green_tier === "LOW_CARBON" ? "text-emerald-300" : plan.green_tier === "HIGH_CARBON" ? "text-amber-300" : "text-slate-200"}`}>
                                {fmt(plan.carbon_emissions_g_co2, 1)} gCO₂ ({fmt(plan.energy_kwh, 3)} kWh)
                              </dd>
                            </div>
                          )}
                          {plan.young_daly_optimal_checkpoint_minutes && (
                            <div className="flex justify-between">
                              <dt>Checkpoint Young-Daly</dt>
                              <dd className="font-mono text-cyan-300">t_opt = {fmt(plan.young_daly_optimal_checkpoint_minutes, 1)} min</dd>
                            </div>
                          )}
                          {plan.cost_basis && (
                            <div className="flex justify-between">
                              <dt>Cost basis</dt>
                              <dd className="font-mono text-amber-300">{plan.cost_basis}</dd>
                            </div>
                          )}
                          <div className="flex justify-between">
                            <dt>Capacity</dt>
                            <dd
                              className={`font-mono ${
                                plan.capacity_status === "QUOTA_AVAILABLE"
                                  ? "text-emerald-300"
                                  : plan.capacity_status === "QUOTA_EXCEEDED"
                                  ? "text-rose-300"
                                  : "text-slate-400"
                              }`}
                              title={plan.capacity_detail || "No quota was checked for this plan."}
                            >
                              {plan.capacity_status || "NOT_CHECKED"}
                            </dd>
                          </div>
                        </dl>
                        {plan.capacity_status === "QUOTA_EXCEEDED" && (
                          <p className="text-xs text-rose-300/90 pt-1">
                            {plan.capacity_detail}
                          </p>
                        )}
                        {(plan.capacity_status === "QUOTA_UNKNOWN" ||
                          plan.capacity_status === "NOT_CHECKED") && (
                          <p className="text-xs text-slate-500 pt-1">
                            Quota not verified for this plan — this is not a guarantee of
                            availability.
                          </p>
                        )}
                        <p className="text-xs text-slate-400 pt-1">{plan.ranking_rationale}</p>
                        <div className="flex items-center space-x-2 pt-2">
                          <button
                            onClick={() => handleApprovePlan(plan.plan_id)}
                            disabled={approvingPlanId === plan.plan_id}
                            className="flex-1 px-2 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 disabled:opacity-50"
                          >
                            {approvedPlanId === plan.plan_id
                              ? "✓ Approved"
                              : approvingPlanId === plan.plan_id
                              ? "Sending…"
                              : "Approve"}
                          </button>
                          <button
                            onClick={() => setPendingExecution(plan)}
                            disabled={executingPlanId === plan.plan_id}
                            className="flex-1 px-2 py-1.5 text-xs rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-cyan-200 disabled:opacity-50"
                            title="Opens an impact summary; nothing is submitted before confirmation."
                          >
                            {executingPlanId === plan.plan_id ? "Submitting…" : "Execute…"}
                          </button>
                        </div>
                        <button
                          onClick={() => handleProposeFallback(plan)}
                          disabled={fallbackPlanId === plan.plan_id}
                          className="w-full px-2 py-1.5 text-xs rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 disabled:opacity-50"
                          title="Asks the server which fallback plan is allowed if this one fails. Executes nothing."
                        >
                          {fallbackPlanId === plan.plan_id ? "Evaluating…" : "Propose a fallback"}
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* Interactive What-If stress simulator. The engine accepted

                                · Compressed deadline:{" "}
                                <span className="font-mono text-slate-300">
                                  {wi.parameters.compressed_deadline_minutes === null ||

          {/* Capacity search (feature 1) */}
          {activeTab === 'capacity' && (

                  />
                </label>
                <label className="flex flex-col space-y-1">
                  <span className="text-slate-400 uppercase tracking-wider">Memory (GB)</span>
                  <input
                    type="number"

                  </span>
                  <input

                </label>

                  </span>

                      <p className="text-xs text-slate-300">{d.observed_facts}</p>

                <button

              {!loadingHistory && !historyError && historyRecords.length === 0 && (

                <div className="overflow-x-auto custom-scrollbar">

                        <th className="text-left py-2">Status</th>
                        <th className="text-right py-2">Tentatives</th>

                    <tbody className="text-slate-200">
                      {historyRecords.map((r, i) => {

                        const attempts = r.attempts || [];
