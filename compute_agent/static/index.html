                              {declared.length > 0 && (
                                <span
                                  className="ml-1 text-amber-400"
                                  title={
                                    declared.length +
                                    " attempt(s) out of " +
                                    attempts.length +
                                    " report a declared, unmeasured cost (" +
                                    declared.map((a) => a.cost_status).join(", ") +
                                    ")"
                                  }
                                >
                                  declared
                                </span>
                              )}
                            </td>
                            <td
                              className={`py-2 text-right font-mono ${
                                delta > 0 ? "text-rose-400" : delta < 0 ? "text-emerald-400" : "text-slate-400"
                              }`}
                            >
                              {delta > 0 ? "+" : ""}{fmt(delta, 2)} €
                            </td>
                            <td className="py-2 text-right font-mono">
                              {fmt(r.final_actual_duration_minutes, 1)} min
                            </td>
                            <td className="py-2 font-mono text-slate-400">{r.reconciliation_status}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}


          {/* Executive FinOps & GreenOps board. Everything here is aggregated
              server-side from the reconciliation store; the page only reads it.
              The ROI of Spot hedging and the carbon cost of a region choice had
              no surface before this tab existed. */}
          {activeTab === 'finops' && (
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                  FinOps &amp; GreenOps portfolio — entire fleet
                </h2>
                <button
                  onClick={fetchFinops}
                  disabled={loadingFinops}
                  className="px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 disabled:opacity-50"
                >
                  {loadingFinops ? "Aggregating…" : "Refresh"}
                </button>
              </div>

              {loadingFinops && (
                <div className="text-sm text-slate-400 py-8 text-center">
                  Aggregating the portfolio…
                </div>
              )}

              {!loadingFinops && finopsError && (
                <div className="rounded-lg border border-rose-500/40 bg-rose-500/10 p-4 text-sm text-rose-200">
                  <div className="font-semibold mb-1">Portfolio analytics unavailable</div>
                  <div className="font-mono text-xs break-words">{finopsError}</div>
                </div>
              )}

              {!loadingFinops && !finopsError && finops && finops.total_workloads === 0 && (
                <div className="text-sm text-slate-500 py-8 text-center">
                  No workload in the history. Execute a plan to populate the portfolio:
                  the amounts shown come exclusively from recorded executions.
                </div>
              )}

              {!loadingFinops && !finopsError && finops && finops.total_workloads > 0 && (
                <div className="space-y-6">
                  {/* Executive KPI row */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <KpiTile
                      icon={<WalletIcon />}
                      label="Actual spend"
                      value={fmt(
                        finops.financial_tiers.tier2_verified_usage_total_eur > 0
                          ? finops.financial_tiers.tier2_verified_usage_total_eur
                          : finops.financial_tiers.tier1_estimated_total_eur,
                        2
                      )}
                      unit="€"
                      sub={`${finops.total_workloads} workload(s) · ${
                        finops.financial_tiers.tier2_verified_usage_total_eur > 0
                          ? "cost measured on observed allocation"
                          : "estimates only, no verified usage"
                      }`}
                    />
                    <KpiTile
                      icon={<WalletIcon />}
                      label="Spot savings"
                      value={fmt(finops.financial_tiers.spot_hedging_savings_eur, 2)}
                      unit="€"
                      tone={finops.financial_tiers.spot_hedging_savings_eur > 0 ? "green" : undefined}
                      sub={`${fmt(
                        finops.financial_tiers.spot_hedging_savings_pct,
                        1
                      )} % below the 100% Standard baseline (${fmt(
                        finops.financial_tiers.on_demand_baseline_equivalent_eur,
                        2
                      )} €)`}
                    />
                    <KpiTile
                      icon={<LeafIcon />}
                      label="Carbon footprint"
                      value={fmt(finops.sustainability_metrics.total_carbon_emissions_g_co2, 1)}
                      unit="gCO₂"
                      sub={`${fmt(finops.sustainability_metrics.total_energy_kwh, 4)} kWh · ${fmt(
                        finops.sustainability_metrics.potential_green_routing_savings_g_co2,
                        1
                      )} gCO₂ avoidable via green routing`}
                    />
                    <KpiTile
                      icon={<ShieldCheckIcon />}
                      label="SLA compliance"
                      value={fmt(finops.reliability_and_governance.sla_compliance_rate_pct, 1)}
                      unit="%"
                      tone={
                        finops.reliability_and_governance.sla_compliance_rate_pct >= 95
                          ? "green"
                          : finops.reliability_and_governance.sla_compliance_rate_pct >= 80
                          ? "amber"
                          : undefined
                      }
                      sub={
                        finops.reliability_and_governance.sla_evaluated_workloads === 0
                          ? "no workload declares a deadline: nothing to evaluate"
                          : `${finops.reliability_and_governance.sla_compliant_workloads}/${finops.reliability_and_governance.sla_evaluated_workloads} on time`
                      }
                    />
                  </div>

                  {/* 3-tier financial reconciliation */}
                  <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-4 space-y-4">
                    <div>
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300">
                        3-tier financial reconciliation
                      </h3>
                      <p className="text-[11px] text-slate-500 mt-0.5">
                        Estimated, measured and billed stay separate: an estimated amount is not an
                        observed amount, and an observed amount is not an invoice.
                      </p>
                    </div>

                    {(() => {
                      const t = finops.financial_tiers;
                      const scale = Math.max(
                        num(t.on_demand_baseline_equivalent_eur),
                        num(t.tier1_estimated_total_eur),
                        num(t.tier2_verified_usage_total_eur),
                        num(t.tier3_reconciled_billed_total_eur),
                        0.01
                      );
                      return (
                        <div className="space-y-3">
                          <ReconciliationBar
                            label="100% Standard baseline (counterfactual)"
                            value={t.on_demand_baseline_equivalent_eur}
                            max={scale}
                            colorClass="bg-slate-600"
                            hint="What the same fleet would have cost without Spot arbitrage."
                          />
                          <ReconciliationBar
                            label="Tier 1 · Estimated at plan time"
                            value={t.tier1_estimated_total_eur}
                            max={scale}
                            colorClass="bg-sky-500"
                            hint="Deterministic assumption produced by the planning engine."
                          />
                          <ReconciliationBar
                            label="Tier 2 · Measured on observed allocation"
                            value={t.tier2_verified_usage_total_eur}
                            max={scale}
                            colorClass="bg-cyan-400"
                            hint="Computed from controller telemetry, never from the request."
                          />
                          <ReconciliationBar
                            label="Tier 3 · Reconciled with billing"
                            value={t.tier3_reconciled_billed_total_eur}
                            max={scale}
                            colorClass="bg-emerald-400"
                            hint={
                              num(t.tier3_reconciled_billed_total_eur) === 0
                                ? "No execution has been reconciled against an invoice yet."
                                : "Amounts confirmed by the billing source."
                            }
                          />
                        </div>
                      );
                    })()}
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    {/* Carbon detail */}
                    <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-4 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <LeafIcon />
                        <span>Carbon balance and green routing</span>
                      </h3>
                      {(() => {
                        const s = finops.sustainability_metrics;
                        const emitted = num(s.total_carbon_emissions_g_co2);
                        const avoidable = num(s.potential_green_routing_savings_g_co2);
                        const pct = emitted > 0 ? Math.min(100, (avoidable / emitted) * 100) : 0;
                        return (
                          <div className="space-y-3">
                            <div className="flex items-baseline justify-between text-xs">
                              <span className="text-slate-400">Emitted</span>
                              <span className="font-mono text-slate-100">{fmt(emitted, 1)} gCO₂</span>
                            </div>
                            <div className="w-full bg-slate-800 h-3 rounded-md overflow-hidden flex">
                              <div
                                className="h-full bg-emerald-500/80"
                                style={{ width: `${100 - pct}%` }}
                              />
                              <div className="h-full bg-amber-500/80" style={{ width: `${pct}%` }} />
                            </div>
                            <div className="flex flex-wrap gap-x-4 gap-y-1 text-[10px] text-slate-400">
                              <span className="flex items-center gap-1.5">
                                <span className="inline-block w-2.5 h-2.5 rounded-sm bg-emerald-500/80" />
                                Irreducible at constant region
                              </span>
                              <span className="flex items-center gap-1.5">
                                <span className="inline-block w-2.5 h-2.5 rounded-sm bg-amber-500/80" />
                                Avoidable via green routing ({fmt(pct, 0)} %)
                              </span>
                            </div>
                            <div className="text-xs text-slate-400 pt-2 border-t border-slate-800">
                              Energy consumed:{" "}
                              <span className="font-mono text-slate-200">
                                {fmt(s.total_energy_kwh, 4)} kWh
                              </span>
                              <div className="text-[11px] text-slate-500 mt-1">
                                The routing gain assumes the workload is allowed to move; it
                                does not apply while the profile forbids changing
                                region.
                              </div>
                            </div>
                          </div>
                        );
                      })()}
                    </div>

                    {/* Governance distribution */}
                    <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-4 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <ShieldCheckIcon />
                        <span>Governance mode distribution</span>
                      </h3>
                      {(() => {
                        const dist =
                          finops.reliability_and_governance.control_mode_distribution || {};
                        const total = Math.max(
                          num(dist.advisory) + num(dist.validation) + num(dist.delegation),
                          1
                        );
                        const rows = [
                          ["advisory", "Advisory (read-only)", "bg-amber-400"],
                          ["validation", "Validation (human approval)", "bg-cyan-400"],
                          ["delegation", "Delegation (bounded autonomy)", "bg-emerald-400"],
                        ];
                        return (
                          <div className="space-y-3">
                            {rows.map(([key, label, color]) => (
                              <div key={key} className="space-y-1">
                                <div className="flex items-baseline justify-between text-xs">
                                  <span className="text-slate-300">{label}</span>
                                  <span className="font-mono text-slate-100">
                                    {num(dist[key])} ({fmt((num(dist[key]) / total) * 100, 0)} %)
                                  </span>
                                </div>
                                <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                  <div
                                    className={`h-full rounded-full transition-all duration-700 ${color}`}
                                    style={{ width: `${(num(dist[key]) / total) * 100}%` }}
                                  />
                                </div>
                              </div>
                            ))}
                            <div className="text-[11px] text-slate-500 pt-1 border-t border-slate-800">
                              The mode shown is the one the server actually applied to
                              the execution, not the one requested by the caller.
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Pre-actuation impact preview. The server is still the only thing
              that decides whether a submission is allowed; this dialog exists so
              the operator sees what is about to be committed before the request
              leaves the browser, instead of discovering it in the result banner. */}
          {pendingExecution && (() => {
            const plan = pendingExecution;
            const mode = serverControl ? serverControl.control_mode : controlMode;
            const isApproved = approvedPlanId === plan.plan_id;
            const cost = num(plan.estimated_cost_eur);
            const stressCost =
              plan.expected_cost_with_preemption_eur === null ||
              plan.expected_cost_with_preemption_eur === undefined
                ? null
                : num(plan.expected_cost_with_preemption_eur);
            const eta = num(plan.total_time_to_result_minutes);
            const remaining = serverControl
              ? num(serverControl.remaining_delegated_budget_eur)
              : null;

            // Blocking conditions, stated before the request is sent. The
            // server re-checks all of them; this is a preview, not a gate.
            const warnings = [];
            if (plan.executable_on_runtime === false) {
              warnings.push(
                "This plan is not executable on the currently attached runtime: the submission will be refused."
              );
            }
            if (mode === "advisory") {
              warnings.push(
                "Advisory mode: the server allows no mutation. The submission will be refused."
              );
            }
            if (mode === "validation" && !isApproved) {
              warnings.push(
                "Validation mode: this plan has no approval recorded server-side. Approve it first."
              );
            }
            if (mode === "delegation" && remaining !== null && cost > remaining) {
              warnings.push(
                `Delegated ceiling exceeded: ${fmt(cost, 2)} € requested against ${fmt(
                  remaining,
                  2
                )} € remaining.`
              );
            }
            if (cost > num(budget)) {
              warnings.push(
                `Estimated cost (${fmt(cost, 2)} €) above the declared budget (${fmt(budget, 2)} €).`
              );
            }
            if (eta > num(deadline)) {
              warnings.push(
                `Projected duration (${fmt(eta, 1)} min) beyond the declared deadline (${fmt(
                  deadline,
                  0
                )} min).`
              );
            }
            if (plan.capacity_status && plan.capacity_status !== "QUOTA_AVAILABLE") {
              warnings.push(
                `Capacity not confirmed (${plan.capacity_status}) : ${
                  plan.capacity_detail || "no quota was verified for this shape."
                }`
              );
            }

            return (
              <div
                className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4"
                onClick={() => setPendingExecution(null)}
              >
                <div
                  className="w-full max-w-2xl max-h-[88vh] overflow-y-auto custom-scrollbar rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-start justify-between gap-4 p-5 border-b border-slate-800">
                    <div>
                      <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-200">
                        Impact preview
                      </h3>
                      <p className="text-xs text-slate-400 mt-1">
                        Nothing has been submitted yet. The server will re-check the mode, the approval and
                        the ceilings before any mutation.
                      </p>
                    </div>
                    <button
                      onClick={() => setPendingExecution(null)}
                      className="text-slate-500 hover:text-slate-200 text-xl leading-none px-2"
                      aria-label="Fermer"
                    >
                      ×
                    </button>
                  </div>

                  <div className="p-5 space-y-4">
                    <div>
                      <div className="text-sm font-semibold text-slate-100">{plan.title}</div>
                      <div className="text-xs font-mono text-slate-400">{plan.plan_id}</div>
                    </div>

                    {/* What is actually being committed */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                      {[
                        ["Machine", plan.machine_type],
                        ["vCPU", `${plan.cpu}${num(plan.gpu) > 0 ? ` · ${plan.gpu} GPU` : ""}`],
                        ["Quantity", plan.quantity || 1],
                        ["Region", plan.zone ? `${plan.region} / ${plan.zone}` : plan.region],
                        ["Provisioning", plan.provisioning_model],
                        ["Capacity", plan.capacity_status || "NOT_CHECKED"],
                      ].map(([k, v]) => (
                        <div key={k} className="rounded-lg border border-slate-800 bg-slate-950/60 p-2.5">
                          <div className="text-[10px] uppercase tracking-wider text-slate-500">{k}</div>
                          <div className="text-xs font-mono text-slate-200 break-words">{v}</div>
                        </div>
                      ))}
                    </div>

                    {/* Financial and temporal envelope */}
                    <div className="rounded-lg border border-slate-800 bg-slate-950/60 p-3 space-y-2 text-xs">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Estimated cost</span>
                        <span className="font-mono text-cyan-300">{fmt(cost, 2)} €</span>
                      </div>
                      {stressCost !== null && (
                        <div className="flex justify-between">
                          <span className="text-slate-400">Expected cost with preemptions</span>
                          <span className="font-mono text-amber-300">{fmt(stressCost, 2)} €</span>
                        </div>
                      )}
                      <div className="flex justify-between">
                        <span className="text-slate-400">Time to result</span>
                        <span className="font-mono text-slate-200">
                          {fmt(eta, 1)} min / {fmt(deadline, 0)} min declared
                        </span>
                      </div>
                      {num(plan.carbon_emissions_g_co2) > 0 && (
                        <div className="flex justify-between">
                          <span className="text-slate-400">Carbon footprint</span>
                          <span
                            className={`font-mono ${
                              plan.green_tier === "LOW_CARBON"
                                ? "text-emerald-300"
                                : plan.green_tier === "HIGH_CARBON"
                                ? "text-amber-300"
                                : "text-slate-200"
                            }`}
                          >
                            {fmt(plan.carbon_emissions_g_co2, 1)} gCO₂
                          </span>
                        </div>
                      )}
                      <div className="flex justify-between pt-2 border-t border-slate-800">
                        <span className="text-slate-400">Cost basis</span>
                        <span className="font-mono text-slate-400">
                          {plan.cost_basis || "modelled_flat_rate_hypothesis"}
                        </span>
                      </div>
                    </div>

                    {/* Governance envelope enforced by the server */}
                    <div className="rounded-lg border border-slate-800 bg-slate-950/60 p-3 space-y-2 text-xs">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Server-applied mode</span>
                        <span className="font-mono text-amber-300 uppercase">{mode}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Approval recorded</span>
                        <span className={`font-mono ${isApproved ? "text-emerald-300" : "text-rose-300"}`}>
                          {isApproved ? "yes" : "no"}
                        </span>
                      </div>
                      {mode === "delegation" && serverControl && (
                        <div className="flex justify-between">
                          <span className="text-slate-400">Remaining delegated ceiling</span>
                          <span className="font-mono text-emerald-300">
                            {fmt(serverControl.remaining_delegated_budget_eur, 2)} € (committed{" "}
                            {fmt(serverControl.committed_cost_eur, 2)} €)
                          </span>
                        </div>
                      )}
                      <div className="flex justify-between">
                        <span className="text-slate-400">Declared fallback plan</span>
                        <span className="font-mono text-slate-200">
                          {plan.fallback_plan_id || "none"}
                        </span>
                      </div>
                    </div>

                    {warnings.length > 0 && (
                      <div className="rounded-lg border border-amber-500/40 bg-amber-500/10 p-3 text-xs text-amber-100 space-y-1">
                        <div className="font-semibold uppercase tracking-wider">
                          Check before submitting
                        </div>
                        {warnings.map((w, i) => (
                          <div key={i}>• {w}</div>
                        ))}
                      </div>
                    )}

                    {Array.isArray(plan.unverified_points) && plan.unverified_points.length > 0 && (
                      <div className="text-[11px] text-slate-500 space-y-0.5">
                        <div className="uppercase tracking-wider">Unverified points</div>
                        {plan.unverified_points.map((u, i) => (
                          <div key={i} className="font-mono">• {u}</div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-end gap-2 p-5 border-t border-slate-800">
                    <button
                      onClick={() => setPendingExecution(null)}
                      className="px-4 py-2 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200"
                    >
                      Annuler
                    </button>
                    {!isApproved && mode === "validation" && (
                      <button
                        onClick={() => handleApprovePlan(plan.plan_id)}
                        disabled={approvingPlanId === plan.plan_id}
                        className="px-4 py-2 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 disabled:opacity-50"
                      >
                        {approvingPlanId === plan.plan_id ? "Sending…" : "Approve first"}
                      </button>
                    )}
                    <button
                      onClick={() => {
                        setPendingExecution(null);
                        handleExecutePlan(plan);
                      }}
                      disabled={executingPlanId === plan.plan_id}
                      className="px-4 py-2 text-xs rounded-lg bg-cyan-600 hover:bg-cyan-500 border border-cyan-500/60 text-white font-semibold disabled:opacity-50"
                    >
                      {executingPlanId === plan.plan_id ? "Submitting…" : "Confirm and submit"}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
