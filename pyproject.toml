[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-compute"
version = "0.2.0"
description = "Google-native agentic control plane for heterogeneous compute runtimes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115.0",
  "google-adk>=1.29.0",
  "google-auth>=2.0.0",
  "mcp>=1.20.0,<2.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
agentic-compute-mcp = "agentic_compute.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_compute"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
